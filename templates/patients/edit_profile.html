{% extends 'base.html' %}

{% block title %}Edit Health Profile | Patient Portal{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-custom p-4 p-md-5">
                <h3 class="fw-bold mb-4"><i class="bi bi-person-fill-gear text-brand-primary me-2"></i>Update Personal Health Profile</h3>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Gender *</label>
                            <select name="gender" class="form-select rounded-3">
                                <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Blood Group</label>
                            <select name="blood_group" class="form-select rounded-3">
                                <option value="">Select Blood Group</option>
                                {% for bg_code, bg_label in patient.BLOOD_GROUP_CHOICES %}
                                    <option value="{{ bg_code }}" {% if patient.blood_group == bg_code %}selected{% endif %}>{{ bg_label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Height (cm) *</label>
                            <input type="number" step="0.1" name="height_cm" value="{{ patient.height_cm }}" class="form-control rounded-3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Weight (kg) *</label>
                            <input type="number" step="0.1" name="weight_kg" value="{{ patient.weight_kg }}" class="form-control rounded-3" required>
                            <small class="text-muted">Calculated BMI: <strong>{{ patient.bmi }}</strong></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Emergency Contact Name</label>
                            <input type="text" name="emergency_contact_name" value="{{ patient.emergency_contact_name|default:'' }}" class="form-control rounded-3">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Emergency Contact Phone</label>
                            <input type="text" name="emergency_contact_phone" value="{{ patient.emergency_contact_phone|default:'' }}" class="form-control rounded-3">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Chronic Health Conditions</label>
                            <textarea name="chronic_conditions" class="form-control rounded-3" rows="2" placeholder="e.g. Asthma, Type-2 Diabetes">{{ patient.chronic_conditions|default:'' }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Residential Address</label>
                            <textarea name="address" class="form-control rounded-3" rows="2">{{ patient.address|default:'' }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'patient_dashboard' %}" class="btn btn-outline-secondary rounded-3">Cancel</a>
                        <button type="submit" class="btn btn-brand-primary rounded-3 px-4">Update Health Vitals</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
