{% extends 'base.html' %}

{% block title %}Verify Email Address | HAPP Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-envelope-check-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark font-heading">Verify Your Email</h3>
                    <p class="text-muted small">Please enter the 6-digit verification OTP sent to your registered email address:</p>
                    <span class="badge bg-light text-dark border px-3 py-2 rounded-pill font-heading fs-6">
                        <i class="bi bi-envelope-fill me-1.5 text-primary"></i>{{ masked_email }}
                    </span>
                </div>

                <form method="post" action="{% url 'verify_email_otp' %}" class="needs-validation" novalidate>
                    {% csrf_token %}
                    <div class="mb-4 text-center">
                        <label class="form-label fw-semibold text-dark mb-2">Email Verification OTP Code</label>
                        <input type="text" name="otp" id="otpInput" maxlength="6" pattern="\d{6}" class="form-control form-control-lg text-center fw-bold fs-3 tracking-widest rounded-3 border-2" placeholder="0 0 0 0 0 0" required autofocus autocomplete="off" style="letter-spacing: 0.4em;">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold py-2.5 shadow-sm mb-3">
                        <i class="bi bi-check2-circle me-1.5"></i>Activate Account & Verify
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <a href="{% url 'login' %}" class="text-decoration-none text-secondary small">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
