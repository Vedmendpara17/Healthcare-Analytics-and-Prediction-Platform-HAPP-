{% extends 'base.html' %}

{% block title %}Forgot Password | HAPP Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="bg-warning-subtle text-warning rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-key-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark font-heading">Reset Password via OTP</h3>
                    <p class="text-muted small">Enter your registered email address below. We will send you a 6-digit OTP to reset your password.</p>
                </div>

                <form method="post" action="{% url 'forgot_password_otp' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-dark">Registered Email Address</label>
                        <input type="email" name="email" class="form-control form-control-lg rounded-3" placeholder="e.g. user@example.com" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-warning btn-lg w-100 rounded-3 fw-bold py-2.5 shadow-sm text-dark mb-3">
                        <i class="bi bi-send me-1.5"></i>Send Password Reset OTP
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <a href="{% url 'login' %}" class="text-decoration-none text-secondary small">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
