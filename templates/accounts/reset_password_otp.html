{% extends 'base.html' %}

{% block title %}Create New Password | HAPP Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-shield-check fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark font-heading">Create New Password</h3>
                    <p class="text-muted small">Enter the 6-digit reset OTP sent to <strong>{{ masked_email }}</strong> and set your new password:</p>
                </div>

                <form method="post" action="{% url 'reset_password_otp' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">6-Digit Reset OTP Code</label>
                        <input type="text" name="otp" maxlength="6" pattern="\d{6}" class="form-control text-center fw-bold fs-4 tracking-widest rounded-3" placeholder="0 0 0 0 0 0" required autofocus style="letter-spacing: 0.3em;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">New Password</label>
                        <input type="password" name="new_password" class="form-control rounded-3" placeholder="Min 8 chars (upper, lower, digit, special)" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-dark">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control rounded-3" placeholder="Re-enter new password" required>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 rounded-3 fw-bold py-2.5 shadow-sm mb-3">
                        <i class="bi bi-check-circle me-1.5"></i>Update Password & Log In
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <a href="{% url 'login' %}" class="text-decoration-none text-secondary small">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
