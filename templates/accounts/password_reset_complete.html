{% extends 'base.html' %}

{% block title %}Password Reset Complete | Healthcare Analytics System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card-custom p-4 p-md-5">
                <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-shield-check fs-2"></i>
                </div>
                <h3 class="fw-bold mb-2">Password Reset Successful!</h3>
                <p class="text-muted mb-4">
                    Your password has been changed successfully. You can now log in with your new credentials.
                </p>
                <a href="{% url 'login' %}" class="btn btn-brand-primary rounded-3 px-4 py-2 fw-semibold">Sign In Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
