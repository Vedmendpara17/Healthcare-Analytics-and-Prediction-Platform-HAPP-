{% extends 'base.html' %}

{% block title %}Broadcast Announcement | Admin Panel{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card-custom p-4 p-md-5">
                <h3 class="fw-bold mb-1"><i class="bi bi-megaphone text-brand-primary me-2"></i>Broadcast System Announcement</h3>
                <p class="text-muted small mb-4">Send in-app alerts and notifications to doctors, patients, or all registered system users.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Target Audience</label>
                        <select name="target" class="form-select rounded-3">
                            <option value="all">All System Users (Doctors + Patients)</option>
                            <option value="doctors">Doctors Only</option>
                            <option value="patients">Patients Only</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Announcement Message *</label>
                        <textarea name="message" class="form-control rounded-3" rows="4" placeholder="Enter broadcast message text e.g. System maintenance scheduled for Sunday at 02:00 AM UTC." required></textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary rounded-3">Cancel</a>
                        <button type="submit" class="btn btn-brand-primary rounded-3 px-4">Dispatch Announcement</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
